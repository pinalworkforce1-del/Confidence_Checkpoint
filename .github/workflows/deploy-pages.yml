name: Deploy Confidence Checkpoint

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Generate offline manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          paths = []
          runtime = [
              'index.html','app.js','styles.css','github.css','ux-standard.css',
              'completion-shell.css','config.js','supabase-sync.js',
              'ux-standard.js','completion-shell.js','offline-sw.js',
              'offline-client.js','offline-progress.js'
          ]
          for name in runtime:
              p = root / name
              if p.is_file():
                  paths.append(p)
          assets = root / 'assets'
          if assets.exists():
              paths.extend(p for p in assets.rglob('*') if p.is_file())

          seen = set()
          rows = []
          total = 0
          for p in sorted(paths):
              rel = './' + p.relative_to(root).as_posix()
              if rel in seen:
                  continue
              seen.add(rel)
              size = p.stat().st_size
              rows.append({'path': rel, 'bytes': size})
              total += size

          manifest = {
              'engine':'Level Up Offline Engine',
              'version':'1.0.0',
              'scope':'/Confidence_Checkpoint/',
              'totalBytes':total,
              'files':rows,
          }
          Path('offline-manifest.json').write_text(json.dumps(manifest, indent=2)+'\n', encoding='utf-8')
          print(f"Offline manifest: {len(rows)} files, {total/1024/1024:.1f} MB")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
