name: Validate Offline Engine

on:
  push:
    branches: ["offline-engine-v1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build offline manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          paths = []
          runtime = [
              'index.html','app.js','styles.css','github.css','ux-standard.css',
              'completion-shell.css','config.js','supabase-sync.js',
              'ux-standard.js','completion-shell.js','offline-sw.js',
              'offline-client.js','offline-progress.js'
          ]
          for name in runtime:
              p = root / name
              if p.is_file():
                  paths.append(p)
          assets = root / 'assets'
          if assets.exists():
              paths.extend(p for p in assets.rglob('*') if p.is_file())

          seen = set()
          rows = []
          total = 0
          for p in sorted(paths):
              rel = './' + p.relative_to(root).as_posix()
              if rel in seen:
                  continue
              seen.add(rel)
              size = p.stat().st_size
              rows.append({'path': rel, 'bytes': size})
              total += size

          manifest = {
              'engine':'Level Up Offline Engine',
              'version':'1.0.0',
              'scope':'/Confidence_Checkpoint/',
              'totalBytes':total,
              'files':rows,
          }
          Path('offline-manifest.json').write_text(json.dumps(manifest, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Validate offline package
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for name in ['index.html','offline-sw.js','offline-client.js','offline-manifest.json']:
              if not Path(name).exists():
                  raise SystemExit('Missing ' + name)

          m = json.loads(Path('offline-manifest.json').read_text())
          paths = [x['path'] for x in m['files']]
          required_exts = ['.js','.css','.png','.mp4']
          for ext in required_exts:
              if not any(p.endswith(ext) for p in paths):
                  raise SystemExit('Manifest has no ' + ext + ' assets')
          if './app.js' not in paths:
              raise SystemExit('app.js missing from manifest')
          print('Validated', len(paths), 'files,', round(m['totalBytes']/1024/1024,1), 'MB')
          PY
